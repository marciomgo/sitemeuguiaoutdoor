name: Publicar docs/ no GitHub Pages

# Publica a pasta docs/ direto, sem passar pelo Jekyll (o workflow
# padrão do GitHub insiste em processar tudo com um gerador de site
# que não precisamos aqui — isso só copia os arquivos como estão).

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
