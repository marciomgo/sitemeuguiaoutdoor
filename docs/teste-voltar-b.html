<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do voltar - página B</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;padding:24px;background:#f4f1e8;color:#3a2a1a}
#estado{margin-top:16px;padding:16px;border-radius:14px;background:#fffdf6;border:2px solid #e4dcc6;font-size:18px;line-height:1.4}
b{color:#e8742a}
</style>
</head>
<body>
<h2>Teste do voltar (página B)</h2>
<p>1) Toque UMA vez em qualquer lugar da tela.<br>2) Aperte o voltar do navegador (ou deslize da borda esquerda) várias vezes.</p>
<div id="estado">Aguardando o primeiro toque...</div>

<script>
// Mesma trava usada no MGO (trava-voltar-elemento.js), numa página simples.
var armado = false;
var urlTrava = '';
var bloqueios = 0;
var erro = '';

function mostrar(){
    document.getElementById('estado').innerHTML =
        armado
            ? '✅ Trava ARMADA. Voltar bloqueado <b>' + bloqueios + '</b> vez(es).' + (erro ? '<br>⚠️ Erro: ' + erro : '')
            : 'Aguardando o primeiro toque...';
}

function armar(){
    if (armado) return;
    armado = true;
    urlTrava = location.href;
    try { history.pushState({ trava: 1 }, '', urlTrava); } catch (e) { erro = String(e); }
    mostrar();
}

['touchend', 'pointerup', 'click', 'keydown'].forEach(function(t){
    window.addEventListener(t, armar, true);
});

window.addEventListener('popstate', function(){
    if (!armado) return;
    bloqueios++;
    try { history.pushState({ trava: 1 }, '', urlTrava); } catch (e) { erro = String(e); }
    mostrar();
});
</script>
</body>
</html>
