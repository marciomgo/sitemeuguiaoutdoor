  var bMus = document.createElement('button'); bMus.id = 'bMusica'; bMus.title = 'Música de fundo'; bMus.textContent = musicaNo.mudo ? '🔇' : (musicaNo.faixa === 'e' ? '⚔️' : '🎵');
  document.getElementById('painel').appendChild(bMus);
  bMus.onclick = function () { /* a cada toque: aventura -> épica -> sem música -> aventura */
    var nome;
    if (MUSICA_EPICA_ATIVA && !musicaNo.mudo && musicaNo.faixa === 'a') { desligarMusica(); musicaNo.faixa = 'e'; musicaNo.passo = 0; ligarMusica(); nome = 'Música épica'; bMus.textContent = '⚔️'; try { localStorage.setItem('mgo-musica', 'e'); } catch (e) {} }

    else { musicaNo.mudo = false; musicaNo.faixa = 'a'; musicaNo.passo = 0; ligarMusica(); nome = 'Música de aventura'; bMus.textContent = '🎵'; try { localStorage.setItem('mgo-musica', 'a'); } catch (e) {} }

(function offline() {

      var arquivos = ['mineu-costas.png', 'mineu-golpe-1.png', 'mineu-golpe-2.png', 'mineu-golpe-3.png', 'mineu-estilingue-1.png', 'mineu-estilingue-2.png', 'mineu-andar-1.png', 'mineu-andar-2.png', 'mineu-andar-3.png', 'mineu-comemora.png', 'icone-pau.png', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png'].concat(typeof ICONES_NUMERADOS !== 'undefined' ? ICONES_NUMERADOS : []).concat([location.pathname.split('/').pop() || 'index.html']);
