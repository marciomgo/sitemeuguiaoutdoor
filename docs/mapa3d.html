<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MGO · Protótipo do mapa 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.1/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#dff0c9;font-family:Arial,Helvetica,sans-serif;overflow:hidden;touch-action:none}
  #mapa{position:absolute;inset:0;z-index:0}
  .chip{position:absolute;left:10px;top:10px;z-index:5;background:rgba(40,30,20,.78);color:#fff;border-radius:14px;padding:7px 12px;font-size:13px;max-width:70%;line-height:1.3}
  .chip b{color:#ffd54f}
  #painel{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:6px}
  #bInc small{display:block;font-size:11px;font-weight:bold;color:#263238;margin-top:1px}
  #painel button{border:0;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:18px;padding:8px 11px;cursor:pointer}
  #controles{position:absolute;left:0;right:0;bottom:14px;z-index:5;display:flex;justify-content:center;gap:14px}
  #controles button{width:62px;height:62px;border:0;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 3px 8px rgba(0,0,0,.4);font-size:26px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #controles button:active{background:#ffe082}
  #controles .mid{margin-bottom:34px}
  #aviso{position:absolute;left:10px;bottom:90px;z-index:5;background:rgba(40,30,20,.7);color:#fff;border-radius:12px;padding:6px 10px;font-size:12px;max-width:60%}
  /* marcadores em pé (billboard) */
  .pino{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));pointer-events:none}
  .pino .bola{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:bold}
  .pino .haste{width:3px;height:10px;background:rgba(255,255,255,.9)}
  .p-ponto .bola{width:34px;height:34px;background:#2979ff;font-size:15px}
  .p-cura .bola{width:30px;height:30px;background:#e53935;font-size:18px}
  .p-pedra .bola{width:24px;height:24px;background:#eceff1;font-size:14px;border-color:#90a4ae}
  .p-pedra.esp .bola{background:#fff3c4;border-color:#f9a825}
  .p-bomba .bola{width:26px;height:26px;background:#212121;font-size:15px;border-color:#fff}
  .p-zumbi{font-size:34px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))}
  .p-chefao{font-size:54px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.6))}
  /* o Mineu: aparece inteiro na frente, de costas pra câmera é só uma ideia — aqui ele é um cartaz em pé */
  #mineu{position:relative;width:70px;height:190px;pointer-events:none}
  #mineu .sombra{position:absolute;left:50%;bottom:-4px;width:84px;height:22px;margin-left:-42px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px)}
  #mineu .anel{position:absolute;left:50%;bottom:-14px;width:120px;height:120px;margin-left:-60px;border-radius:50%;border:3px solid rgba(255,160,0,.8);background:radial-gradient(circle,rgba(255,213,79,.25),rgba(255,213,79,0) 70%);transform:rotateX(70deg);animation:pulsa 1.6s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:.5;scale:.9}50%{opacity:1;scale:1.08}}
  #mineu .corpo{position:absolute;left:0;top:0;width:70px;height:190px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
  #mineu img{position:absolute;width:70px;height:190px;left:0;top:0}
  #mineu.anda .corpo{animation:balanca .42s ease-in-out infinite}
  @keyframes balanca{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
  #btnAtirar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;width:70px;height:70px;padding:11px;box-sizing:border-box;border:none;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation}
  #btnAtirar img{width:100%;height:100%;object-fit:contain;display:block}
  #btnAtirar:active{transform:translateX(-50%) scale(.94)}
  #trocaPedraWrap{position:absolute;bottom:8px;left:calc(50% - 90px);z-index:5;width:46px;height:46px}
  #btnTrocaPedra{position:relative;z-index:2;width:46px;height:46px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #90a4ae;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;font-size:20px;line-height:1}
  #btnTrocaPedra.esp{border-color:#f9a825;background:#fff8e1}
  #btnTrocaPedra small{font-size:11px;font-weight:bold;color:#37474f}
  .pedra-reserva{position:absolute;z-index:1;left:-15px;bottom:-9px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #90a4ae;background:#eceff1;box-shadow:0 1px 4px rgba(0,0,0,.45);font-size:13px;cursor:pointer}
  .pedra-reserva.esp{border-color:#f9a825;background:#fff3c4}
  .vida{position:absolute;left:50%;top:-9px;width:32px;height:5px;margin-left:-16px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden;border:1px solid #fff}
  .vida i{display:block;height:100%;width:100%;background:#43a047}
  .golpe{animation:golpe .18s linear}
  @keyframes golpe{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
  .pedrada{font-size:34px;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
  .pedrada.esp{filter:drop-shadow(0 0 6px #ffca28) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
  .mira-alvo{width:64px;height:64px;margin:0;border-radius:50%;border:4px solid #ff1744;box-shadow:0 0 12px #ff1744,inset 0 0 8px #ff174488;pointer-events:none}
  #bus{font-weight:bold;color:#ffd54f}
  #legenda{position:absolute;left:10px;top:78px;z-index:5;background:rgba(40,30,20,.7);color:#ffd54f;border-radius:10px;padding:4px 9px;font-size:11px;max-width:60%}
  .maplibregl-ctrl-top-left{top:84px;left:4px}
  .maplibregl-ctrl-bottom-right{top:0;bottom:auto;right:64px}
  .maplibregl-ctrl-attrib{background:transparent !important;margin:4px !important}
  .maplibregl-ctrl-attrib-button{width:20px;height:20px;opacity:.5;background-color:rgba(255,255,255,.35) !important;border-radius:50%}
  .maplibregl-ctrl-attrib.maplibregl-compact-show{background:rgba(255,255,255,.8) !important;font-size:10px}
  .maplibregl-ctrl-scale{font-size:12px;font-weight:bold;background:rgba(255,255,255,.85);border-color:#37474f;color:#263238}
  #mineu{transition:height .25s}
  #mineu .corpo{transition:height .25s;overflow:hidden}
  #mineu img{transition:height .25s}
  .mine-vida{top:-12px}
  .mine-vida i{background:#e53935}
  .anda-z{display:inline-block;animation:bobz .5s ease-in-out infinite}
  @keyframes bobz{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
  #sangue{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(229,57,53,0) 45%,rgba(229,57,53,.55) 100%)}
  #sangue.bate{animation:sangra .45s ease-out}
  @keyframes sangra{0%{opacity:1}100%{opacity:0}}
  .rastro{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none;z-index:100000;animation:poof .5s forwards}
  .rastro.esp{background:rgba(255,213,79,.9)}
  @keyframes poof{to{transform:scale(.2);opacity:0}}
  .estouro{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:5px solid #fff;pointer-events:none;z-index:100000;animation:bum .45s ease-out forwards}
  @keyframes bum{to{transform:scale(4.5);opacity:0;border-width:1px}}
  #mineu .anel{display:none}
  #btnTrocaPedra.galho{border-color:#8d5a2b;background:#f3e6d2}
  #btnTrocaPedra svg{width:24px;height:24px;transform:rotate(35deg)}
  .pedra-reserva svg{width:14px;height:14px;transform:rotate(35deg)}
  .pedra-reserva.galho{border-color:#8d5a2b;background:#f3e6d2}
  #btnAtirar svg{width:100%;height:100%;display:block;transform:rotate(35deg)}
  #galhoMineu{position:absolute;right:-18px;bottom:34px;width:26px;height:112px;transform-origin:50% 94%;transform:rotate(8deg);pointer-events:none;display:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
  #galhoMineu svg{width:100%;height:100%;display:block}
  #galhoMineu.bate{animation:bate .38s ease-in-out}
  @keyframes bate{0%{transform:rotate(8deg)}35%{transform:rotate(-72deg)}70%{transform:rotate(48deg)}100%{transform:rotate(8deg)}}
  #arcoGolpe{position:absolute;left:-42px;top:-62px;width:154px;height:70px;border-radius:50% 50% 0 0 / 100% 100% 0 0;border-top:9px solid rgba(255,255,255,.95);filter:drop-shadow(0 0 6px rgba(255,255,255,.9));opacity:0;pointer-events:none}
  #arcoGolpe.bate{animation:arco .32s ease-out}
  @keyframes arco{0%{opacity:0;transform:scale(.55)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
  #mineu,#mineu .corpo,#mineu img{transition:none}
  #mineu .interno{position:absolute;left:0;top:0;right:0;bottom:0;transform-origin:50% 100%;transform:scale(.5)}
  .fogo{font-size:34px;pointer-events:none;filter:drop-shadow(0 0 8px #ff6d00)}
  .fogo.roxo{filter:hue-rotate(255deg) saturate(1.5) drop-shadow(0 0 8px #aa00ff)}
  .rastro.fogo{background:rgba(255,109,0,.85);filter:none}
  .rastro.roxo{background:rgba(170,0,255,.85);filter:none}
  .pe-amarela{display:inline-block;filter:sepia(1) saturate(6) hue-rotate(-10deg) brightness(1.15)}
  #inicio{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(25,35,18,.5)}
  #bInicio{font-size:20px;font-weight:bold;padding:20px 28px;border:0;border-radius:999px;background:#ffd54f;color:#2b2110;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation}
  #bInicio:active{transform:scale(.97)}
  #mineu.comPau .corpo:not(#corpoGolpe):not(#corpoEst) img{visibility:hidden}
  #mineu.comPau #galhoMineu{display:none !important}
</style>
</head>
<body>
<div id="mapa"></div>
<div id="inicio"><button id="bInicio">📍 Ativar GPS e bússola</button></div>
<span id="dica" style="display:none"></span>
<div id="painel">
  <button id="bGps" title="Usar meu GPS e bússola">📍</button>
  <button id="bMais" title="Aproximar">＋</button>
  <button id="bMenos" title="Afastar">－</button>
  <button id="bSat" title="Mapa de satélite">🛰️</button>
  <button id="bInc" title="Mudar a inclinação"></button>
</div>
<div id="sangue"></div>
<div id="aviso" style="display:none"></div>
<button id="btnAtirar" aria-label="Atirar"><img src="https://static.wixstatic.com/media/f02643_23b401c7466341439fbcbc7e4b07773b~mv2.png" alt="Estilingue"></button>
<div id="trocaPedraWrap"><span id="pedraReserva" class="pedra-reserva esp">🪨</span><button id="btnTrocaPedra" aria-label="Trocar de munição"><span>🪨</span><small id="qtdPedra">150</small></button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.1/maplibre-gl.js"></script>
<script>
const DADOS = {"largada":{"lat":-30.0261175,"lng":-51.200454},"pontos":[{"n":1,"lat":-30.025285,"lng":-51.2005249},{"n":2,"lat":-30.0256294,"lng":-51.2007359},{"n":4,"lat":-30.0253648,"lng":-51.2012556},{"n":8,"lat":-30.0268436,"lng":-51.2000377},{"n":10,"lat":-30.0250412,"lng":-51.2007344},{"n":11,"lat":-30.0254446,"lng":-51.2013569},{"n":12,"lat":-30.0260174,"lng":-51.2001361},{"n":13,"lat":-30.0257,"lng":-51.2001409},{"n":14,"lat":-30.0253963,"lng":-51.2008612},{"n":15,"lat":-30.0256525,"lng":-51.2010556},{"n":16,"lat":-30.0255974,"lng":-51.2006363},{"n":19,"lat":-30.0254112,"lng":-51.2004072},{"n":20,"lat":-30.0268886,"lng":-51.2013553},{"n":24,"lat":-30.025707,"lng":-51.2008443}],"curas":[{"lat":-30.025403,"lng":-51.2007498},{"lat":-30.0270763,"lng":-51.1999384},{"lat":-30.0270772,"lng":-51.2015517},{"lat":-30.0261369,"lng":-51.1998224},{"lat":-30.0272214,"lng":-51.2006654}],"pedras":[{"lat":-30.0253271,"lng":-51.2003955,"esp":false},{"lat":-30.0270355,"lng":-51.1996235,"esp":false},{"lat":-30.0267353,"lng":-51.201509,"esp":false},{"lat":-30.0260648,"lng":-51.2000644,"esp":false},{"lat":-30.0254155,"lng":-51.2011644,"esp":false},{"lat":-30.027346,"lng":-51.2016973,"esp":false},{"lat":-30.0274009,"lng":-51.2009681,"esp":false},{"lat":-30.0272368,"lng":-51.2001024,"esp":false},{"lat":-30.0252635,"lng":-51.2006777,"esp":true},{"lat":-30.0271762,"lng":-51.1999154,"esp":true},{"lat":-30.026804,"lng":-51.2013345,"esp":true}],"bombas":[{"lat":-30.0272565,"lng":-51.2005082,"e":"🍌"},{"lat":-30.0273906,"lng":-51.2013658,"e":"🐝"},{"lat":-30.0262433,"lng":-51.2006968,"e":"🐍"},{"lat":-30.0266036,"lng":-51.2003087,"e":"💩"},{"lat":-30.0276218,"lng":-51.1998486,"e":"🐶"}],"chefoes":[{"lat":-30.0257,"lng":-51.2001409,"final":true}],"zumbis":[{"lat":-30.02563,"lng":-51.20023},{"lat":-30.02577,"lng":-51.20005},{"lat":-30.02569,"lng":-51.20028}]};

  sky: { 'sky-color': '#bfe6ff', 'horizon-color': '#fff3d1', 'fog-color': '#f1f6dd', 'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.85, 'fog-ground-blend': 0.55 },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#e1f1c9' } },

    { id: 'grama', type: 'fill', source: 'omt', 'source-layer': 'landcover', filter: ['==', ['get', 'class'], 'grass'], paint: { 'fill-color': '#cbe9a6' } },
    { id: 'mata', type: 'fill', source: 'omt', 'source-layer': 'landcover', filter: ['==', ['get', 'class'], 'wood'], paint: { 'fill-color': '#b4dd8d' } },
    { id: 'parque', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': '#b9e29c', 'fill-opacity': 0.9 } },
    { id: 'quadra', type: 'fill', source: 'omt', 'source-layer': 'landuse', filter: ['in', ['get', 'class'], ['literal', ['pitch', 'playground']]], paint: { 'fill-color': '#f3dba5' } },
    { id: 'agua', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': '#80cfee' } },
    { id: 'rio', type: 'line', source: 'omt', 'source-layer': 'waterway', paint: { 'line-color': '#80cfee', 'line-width': largura } },
    { id: 'rua-borda', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['minor', 'service', 'tertiary', 'secondary', 'primary', 'trunk']]], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#e0cfb0', 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 14, 1.2, 19, 13] } },
    { id: 'rua', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['minor', 'service', 'tertiary', 'secondary', 'primary', 'trunk']]], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#fffaf0', 'line-width': largura } },
    { id: 'trilha', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['path', 'track', 'pedestrian']]], layout: { 'line-cap': 'round' }, paint: { 'line-color': '#f2c27a', 'line-width': ['interpolate', ['linear'], ['zoom'], 15, 1, 19, 3.5], 'line-dasharray': [2, 1.4] } },
    { id: 'predio', type: 'fill-extrusion', source: 'omt', 'source-layer': 'building', minzoom: 14, paint: {

        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
        'fill-extrusion-opacity': 0.97, 'fill-extrusion-vertical-gradient': true } },

    { id: 'galho-fundo', type: 'fill', source: 'galho-alc', paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.32 } },
    { id: 'galho-borda', type: 'line', source: 'galho-alc', paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 0.95 } },
    { id: 'alcance-fundo', type: 'fill', source: 'alcance-fill', paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.32 } },
    { id: 'alcance-sombra', type: 'line', source: 'alcance', paint: { 'line-color': '#000', 'line-width': 6, 'line-opacity': 0.35, 'line-blur': 2 } },

    { id: 'mira-linha', type: 'line', source: 'mira', paint: { 'line-color': '#ff1744', 'line-width': 3, 'line-opacity': 0.85, 'line-dasharray': [2, 1.5] } },
    { id: 'zona-borda', type: 'line', source: 'zona-borda', paint: { 'line-color': ['get', 'cor'], 'line-opacity': 0.35, 'line-width': 2, 'line-dasharray': [3, 2] } }
  ]
};

function circulo(lat, lng, raioM, passos) {
  var pts = [];
  for (var i = 0; i <= passos; i++) {
    var a = (i / passos) * 2 * Math.PI;
    var dLat = (raioM * Math.cos(a)) / 111320;
    var dLng = (raioM * Math.sin(a)) / (111320 * Math.cos(lat * rad));

  }
  return pts;

var camadasZona = [], bordasZona = [];

  [1, 0.78, 0.56, 0.34].forEach(function (f, i) {

});

}

function marcador(lat, lng, classe, html, ancora) {
  var el = document.createElement('div');
  el.className = classe;

  inimigos.forEach(function (i) { if (i.vivo && metrosAte(i.lat, i.lng).d <= lim) perto = true; });
  var era = emBatalha;
  if (perto) { emBatalha = true; ultimoPerto = agora; } else if (emBatalha && agora - ultimoPerto > 1500) emBatalha = false;
  if (era !== emBatalha) pintaInc();
  fBat += ((emBatalha ? 1 : 0) - fBat) * (1 - Math.exp(-3 * dt));
}
function quadro(agora) {
  var dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora;
  var andando = false;
  if (!modoReal) {
    if (tecla.esq) heading -= 110 * dt;
    if (tecla.dir) heading += 110 * dt;
    var v = (tecla.anda ? 1 : 0) - (tecla.volta ? 0.6 : 0);
    if (v !== 0) {
      andando = true;
      var m = 6 * v * dt;
      POS.lat += (m * Math.cos(heading * rad)) / 111320;
      POS.lng += (m * Math.sin(heading * rad)) / (111320 * Math.cos(POS.lat * rad));
    }
  } else {
    var k = 1 - Math.exp(-4 * dt);
    var antes = POS.lat + POS.lng;
    POS.lat += (ALVO.lat - POS.lat) * k; POS.lng += (ALVO.lng - POS.lng) * k;
    andando = Math.abs((POS.lat + POS.lng) - antes) > 1e-8;
  }
  heading = (heading + 360) % 360;
  bearing += difAng(bearing, heading) * (1 - Math.exp(-7 * dt));
  mkMineu.setLngLat([POS.lng, POS.lat]);
  moverInimigos(dt, agora);
  atualizarMira();
  if (++contaQuadro % 3 === 0) atualizarAlcance();
  if (GRADE && contaQuadro % 20 === 0) {
    var dgl = (POS.lat - GRADE.lat0) * 111320, dgn = (POS.lng - GRADE.lng0) * 111320 * GRADE.cl;
    if (dgl * dgl + dgn * dgn > 50 * 50) { if (carregarObstaculos(POS.lat, POS.lng)) construirGrade(POS.lat, POS.lng); } else atualizarCampo();
  }
  if (contaQuadro % 4 === 0) atualizarZonas(inimigos.filter(function (i) { return i.chefao && i.vivo; }).map(function (i) { return { lat: i.lat, lng: i.lng, final: i.final }; }));
  elMineu.classList.toggle('anda', andando);
  ordenarProfundidade();
  atualizarBatalha(dt, agora);
  var pitchEf = Math.min(80, inclinacao + BATALHA_MAIS_INC * fBat);
  var zoomEf = zoom + ZOOM_BATALHA_EXTRA * fBat;
  var esc = ESC_EXPLORA + (1 - ESC_EXPLORA) * fBat;
  if (Math.abs(pitchEf - ultPitchSprite) > 0.4 || Math.abs(esc - ultEsc) > 0.004) {
    ultPitchSprite = pitchEf; ultEsc = esc;
    ajustarMineu(pitchEf); elInterno.style.transform = 'scale(' + esc.toFixed(3) + ')';
    // a barra de vida fica fora do desenho reduzido, então o tamanho dela não encolhe junto com o Mineu
    elMineu.querySelector('.mine-vida').style.top = (parseFloat(elMineu.style.height) * (1 - esc) - 11) + 'px';
  }
  mapa.jumpTo({ center: [POS.lng, POS.lat], bearing: bearing, pitch: pitchEf, zoom: zoomEf, padding: { top: Math.round(window.innerHeight * 0.42), bottom: 0, left: 0, right: 0 } });
  requestAnimationFrame(quadro);
}
mapa.on('load', function () {
  var at = document.querySelector('.maplibregl-ctrl-attrib'); // créditos do mapa: só o ícone ⓘ, no topo; toque pra abrir
  if (at) { at.classList.remove('maplibregl-compact-show'); at.removeAttribute('open'); }
  requestAnimationFrame(quadro); if (!DADOS.livre) quandoMapaPronto(ajustarInimigosFixos); });
</script>
