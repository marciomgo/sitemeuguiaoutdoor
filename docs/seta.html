<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seta de navegação</title>
<style>
html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}
#container{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
}
#seta{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    transition: transform 0.15s linear;
    transform: rotate(0deg);
}
#seta svg{
    width:70%;height:70%;
}
button{
    padding:14px 20px;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#2b6ef2;
    color:#fff;
    cursor:pointer;
}
</style>
</head>
<body>

<!--
    Seta de navegação (bússola).

    O iOS bloqueia o pedido de permissão de bússola
    (DeviceOrientationEvent.requestPermission) quando é feito de dentro
    de um iframe de outra origem — bloqueia na hora, sem nem mostrar a
    pergunta pro usuário (confirmado testando ao vivo). Por isso essa
    página tem dois "modos", dependendo de como foi aberta:

    - MODO EMBUTIDO (dentro do iframe do jogo, #htmlSetaGps): só mostra
      um botão "Abrir seta". Ao tocar, abre ESSA MESMA página de novo
      numa aba nova de verdade (window.open) — aí sim o iOS libera a
      permissão. A partir daí, o iframe escondido dentro do jogo vira
      um retransmissor: tudo que o Wix manda pra ele (localização atual,
      próximo ponto) ele repassa automaticamente pra aba nova via
      postMessage. Assim a família só precisa abrir a aba UMA vez — não
      precisa ficar tocando de novo toda hora que um ponto é concluído.

    - MODO ABA PRÓPRIA (a aba nova que foi aberta): pede a permissão de
      verdade (gesto de toque genuíno, fora de iframe = funciona) e
      escuta os dados retransmitidos pelo iframe (via window.opener) pra
      girar a seta.
-->

<div id="container">

    <button id="btnAbrirAba" onclick="abrirAba()">🧭 Abrir seta</button>

    <button id="btnAtivar" onclick="ativarBussola()" style="display:none;">🧭 Ativar bússola</button>

    <div id="seta" style="display:none;">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,6 78,88 50,68 22,88" fill="#2b6ef2" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
        </svg>
    </div>

</div>

<script>

const emIframe = (window.self !== window.top);

const btnAbrirAba = document.getElementById('btnAbrirAba');
const btnAtivar = document.getElementById('btnAtivar');
const seta = document.getElementById('seta');

let minhaLat = null;
let minhaLng = null;
let alvoLat = null;
let alvoLng = null;
let heading = null;

function calcularBearing(lat1, lon1, lat2, lon2){

    const toRad = g => g * Math.PI / 180;
    const toGrau = r => r * 180 / Math.PI;

    const dLon = toRad(lon2 - lon1);

    const y = Math.sin(dLon) * Math.cos(toRad(lat2));

    const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

    const bearing = toGrau(Math.atan2(y, x));

    return (bearing + 360) % 360;

}

function atualizarRotacao(){

    if(minhaLat === null || minhaLng === null || alvoLat === null || alvoLng === null || heading === null){
        return;
    }

    const bearing = calcularBearing(minhaLat, minhaLng, alvoLat, alvoLng);
    const angulo = (bearing - heading + 360) % 360;

    seta.style.transform = 'rotate(' + angulo + 'deg)';

}

function aoReceberOrientacao(evento){

    if(typeof evento.webkitCompassHeading === 'number'){

        // iOS — já vem absoluto (0° = Norte).
        heading = evento.webkitCompassHeading;

    } else if(evento.absolute && typeof evento.alpha === 'number'){

        // Android — "alpha" cresce sentido anti-horário a partir do
        // Norte, o oposto de heading de bússola.
        heading = (360 - evento.alpha) % 360;

    } else if(typeof evento.alpha === 'number'){

        heading = (360 - evento.alpha) % 360;

    } else {
        return;
    }

    atualizarRotacao();

}

function iniciarEscuta(){

    btnAtivar.style.display = 'none';
    seta.style.display = 'flex';

    if('ondeviceorientationabsolute' in window){
        window.addEventListener('deviceorientationabsolute', aoReceberOrientacao);
    } else {
        window.addEventListener('deviceorientation', aoReceberOrientacao);
    }

}

function ativarBussola(){

    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){

        DeviceOrientationEvent.requestPermission()
            .then((resultado) => {

                if(resultado === 'granted'){
                    iniciarEscuta();
                } else {
                    btnAtivar.textContent = '⚠️ Permissão negada';
                }

            })
            .catch(() => {
                btnAtivar.textContent = '⚠️ Erro ao pedir permissão';
            });

    } else {

        // Android e navegadores que não exigem essa permissão.
        iniciarEscuta();

    }

}

//==================================================
// MODO EMBUTIDO — retransmissor (dentro do iframe do jogo)
//==================================================

let popupSeta = null;

// Guarda os últimos dados recebidos do Wix, pra poder repassar assim
// que a aba nova abrir (não precisa esperar a próxima atualização).
let ultimaLocalizacao = null;
let ultimoAlvo = null;

function abrirAba(){

    popupSeta = window.open(window.location.href, 'setaGps');

    btnAbrirAba.textContent = '✅ Seta aberta numa aba separada';

    // Repassa o que já sabemos assim que a aba estiver pronta pra
    // receber (ela avisa via postMessage quando carregar).

}

function repassarParaPopup(dados){

    if(popupSeta && !popupSeta.closed){
        popupSeta.postMessage(dados, '*');
    }

}

//==================================================
// Recebe mensagens (do Wix, se estiver no iframe do jogo; ou do
// iframe-mãe, se estiver na aba própria depois de aberta por ele).
//==================================================

window.onmessage = function(event){

    const dados = event.data || {};

    if(emIframe){

        // Está dentro do jogo — guarda e repassa pra aba nova, se já
        // estiver aberta.
        if(dados.acao === 'minhaLocalizacao' || dados.acao === 'proximoPonto'){
            if(dados.acao === 'minhaLocalizacao') ultimaLocalizacao = dados;
            if(dados.acao === 'proximoPonto') ultimoAlvo = dados;
            repassarParaPopup(dados);
        }

        if(dados.acao === 'setaAbertaPronta'){
            // A aba nova avisou que carregou — manda o que já temos.
            if(ultimaLocalizacao) repassarParaPopup(ultimaLocalizacao);
            if(ultimoAlvo) repassarParaPopup(ultimoAlvo);
        }

        return;

    }

    // Está na aba própria — aplica os dados recebidos (do iframe-mãe).
    if(dados.acao === 'minhaLocalizacao'){
        minhaLat = dados.lat;
        minhaLng = dados.lng;
        atualizarRotacao();
    }

    if(dados.acao === 'proximoPonto'){
        alvoLat = dados.latitude;
        alvoLng = dados.longitude;
        atualizarRotacao();
    }

};

//==================================================
// Inicialização — mostra a UI certa dependendo do modo.
//==================================================

if(emIframe){

    btnAbrirAba.style.display = 'inline-block';
    parent.postMessage({ acao: 'setaPronta' }, '*');

} else {

    btnAbrirAba.style.display = 'none';
    btnAtivar.style.display = 'inline-block';

    if(window.opener){
        window.opener.postMessage({ acao: 'setaAbertaPronta' }, '*');
    }

}

</script>

</body>
</html>
