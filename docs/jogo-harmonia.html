/* bloco pedraDireita: botoes da pedra a direita do estilingue (o estilingue fica centralizado) */
#trocaPedraWrap{left:calc(50% + 52px)}
.pedra-reserva{left:auto;right:-22px}
#pedraReserva2{left:auto;right:-24px}
</style>
<style>/* bloco pesquisa */
/* bloco pesquisa: tela de perguntas dentro do jogo */
#pesquisaJogo{position:fixed;inset:0;z-index:2147482000;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#pesquisaJogo .pq-card{background:#fff;border-radius:18px;padding:18px 16px;width:100%;max-width:360px;max-height:94vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#1b1b1b}
#pesquisaJogo h2{margin:0;text-align:center;font-size:21px}
#pesquisaJogo .pq-sub{margin:4px 0 8px;text-align:center;font-size:13px;color:#555}
#pesquisaJogo .pq-pergunta{margin:12px 0 6px;font-weight:bold;font-size:15px}
#pesquisaJogo .pq-pergunta small{font-weight:normal;color:#777;font-size:11px}
#pesquisaJogo .pq-linha{display:flex;gap:8px}
#pesquisaJogo .pq-cara{flex:1;padding:8px 2px;border:2px solid #cfd8dc;border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation}
#pesquisaJogo .pq-cara span{display:block;font-size:28px;line-height:1.1}
#pesquisaJogo .pq-cara small{display:block;font-size:11px;color:#444;margin-top:2px}
#pesquisaJogo .pq-cara.on{border-color:#2e7d32;background:#e8f5e9}
#pesquisaJogo .pq-chips{display:flex;flex-wrap:wrap;gap:6px}
#pesquisaJogo .pq-chip{padding:7px 11px;border:2px solid #cfd8dc;border-radius:999px;background:#fff;font-size:13px;cursor:pointer;touch-action:manipulation}
#pesquisaJogo .pq-chip.on{border-color:#ef6c00;background:#fff3e0}
#pesquisaJogo textarea{width:100%;box-sizing:border-box;border:2px solid #cfd8dc;border-radius:10px;padding:8px;font:inherit;font-size:14px;resize:none}
#pesquisaJogo .pq-nota{margin:8px 0 10px;font-size:11px;color:#666;text-align:center}
#pesquisaJogo #pqEnviar{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
#pesquisaJogo #pqEnviar:disabled{background:#b0bec5}
#pesquisaJogo #pqPular{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:#555;font-size:14px;text-decoration:underline;cursor:pointer}
#pesquisaJogo .pq-obrigado{padding:34px 10px;text-align:center;font-size:24px;font-weight:bold}
/* botao da tela de parabens */
#bPesquisaFim{display:block;width:100%;margin-top:12px;font-size:15px;font-weight:bold;padding:12px 16px;border:2px solid #2e7d32;border-radius:999px;background:#fff;color:#2e7d32;cursor:pointer;touch-action:manipulation}
</style>
<style>/* bloco pacoteObrigatorio */
/* bloco pacoteObrigatorio: tela inicial com o download em primeiro lugar */
#barraPacote{display:none;width:100%;height:10px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden}
#barraPacote i{display:block;height:100%;width:0;background:#ffd54f;transition:width .25s}
#bOffline.pacotePrincipal{background:#ffd54f;color:#3b2a00;border-color:#ffd54f;font-size:16px;padding:14px 18px}
#bInicio.pacoteTrava{opacity:.45;filter:grayscale(.6)}
#bAssimMesmo{display:none;background:none;border:0;color:#fff;text-decoration:underline;font-size:12px;text-align:center;opacity:.85;cursor:pointer;touch-action:manipulation;text-shadow:0 1px 3px rgba(0,0,0,.7)}
</style>
